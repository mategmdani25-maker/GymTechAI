<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GymTechAI Dashboard</title><style>body{font-family:system-ui;background:#10131a;color:#f4f6fa;max-width:1100px;margin:auto;padding:24px}button{background:#36d399;border:0;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer}input{width:80px;padding:8px;margin:4px;background:#202633;color:white;border:1px solid #465063;border-radius:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#1a202c;padding:16px;border-radius:12px;margin:12px 0}.bar{height:14px;background:#30394a;border-radius:8px;overflow:hidden}.fill{height:100%;background:#36d399}.week{display:inline-block;background:#202633;padding:10px;margin:4px;border-radius:8px;cursor:pointer}.muted{color:#9ca8ba}</style></head><body><h1>🏋️ GymTechAI</h1><p class="muted">Dashboard de progreso conectado a FastAPI y Swagger.</p><div class="card"><h2>Generar macrociclo</h2><div class="grid"><label>Sentadilla<br><input id="snt" type="number" value="140"></label><label>Banca<br><input id="bnc" type="number" value="100"></label><label>RDL<br><input id="rdl" type="number" value="150"></label><label>Semanas<br><input id="weeks" type="number" value="12" min="4" max="52"></label></div><br><button onclick="generate()">Generar rutina</button> <a href="/docs" target="_blank" style="color:#36d399;margin-left:16px">Abrir Swagger →</a></div><div id="summary"></div><div id="weeks"></div><script>let data;async function generate(){const body={tipo_usuario:'premium',semanas_totales:+weeks.value,rm_snt:+snt.value,reps_snt:1,rm_bnc:+bnc.value,reps_bnc:1,rm_rdl:+rdl.value,reps_rdl:1};const r=await fetch('/api/v1/workouts/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});data=await r.json();render()}function render(){summary.innerHTML=`<div class="card"><h2>${data.semanas_totales} semanas</h2><p>1RM estimados: sentadilla ${data['1rm_estimados'].snt}kg · banca ${data['1rm_estimados'].bnc}kg · RDL ${data['1rm_estimados'].rdl}kg</p></div>`;weeks.innerHTML='<h2>Progresión semanal</h2>'+data.semanas.map((w,i)=>`<div class="week" onclick="show(${i})">S${w.semana}<br><small>${w.fase}</small><div class="bar"><div class="fill" style="width:${Math.min(w.porcentaje,100)}%"></div></div>${w.porcentaje}%</div>`).join('')}function show(i){const w=data.semanas[i];document.getElementById('summary').innerHTML=`<div class="card"><h2>Semana ${w.semana}: ${w.fase}</h2><p>Intensidad: ${w.porcentaje}% · Tonelaje: ${w.tonelaje_kg} kg</p><pre>${JSON.stringify({lunes:w.lunes,miercoles:w.miercoles},null,2)}</pre></div>`}generate()</script></body></html>
